<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Whistle-Echo (Fixed Delay Engine)</title>
    <style>
      :root {
        --bg: #070c16;
        --card: rgba(19, 28, 51, 0.6);
        --border: #1e293b;
        --text: #e6ecff;
        --muted: #8493b5;
        --primary: #7c9cff;
        --primary-ink: #0b1220;
        --danger: #ff7a7a;
        --success: #50e3c2;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      
      body {
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background-color: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        min-height: 100dvh;
        padding: 2rem 1.25rem;
      }

      .main-container {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        width: 100%;
        max-width: 900px;
        margin: auto;
      }
      
      header { text-align: center; max-width: 36rem; }
      h1 { 
        font-size: clamp(2rem, 5vw, 3rem); 
        margin: 0 0 .5rem; 
        font-weight: 800;
        background: linear-gradient(135deg, #fff 30%, var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      header p { color: var(--muted); margin: 0; font-size: 1rem; }
      
      .control-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        width: 100%;
        max-width: 24rem;
      }

      .orb {
        position: relative;
        width: 12rem; height: 12rem;
        border-radius: 999px;
        border: 2px solid var(--border);
        background: #111a2e;
        display: grid; place-items: center;
        transition: all .3s ease;
      }
      .orb.listening {
        border-color: var(--primary);
        box-shadow: 0 0 50px -10px var(--primary);
      }
      .orb.captured {
        border-color: var(--success);
        box-shadow: 0 0 60px -5px var(--success);
      }
      .orb.cooldown {
        border-color: var(--danger);
        box-shadow: 0 0 40px -10px var(--danger);
      }
      .orb .emoji { font-size: 3rem; }
      .orb .tag {
        margin-top: .5rem; font-size: .75rem;
        text-transform: uppercase; letter-spacing: .15em;
        color: var(--muted); font-weight: 700;
      }
      
      button.action {
        appearance: none; border: 0; cursor: pointer;
        background: var(--primary); color: var(--primary-ink);
        font: inherit; font-weight: 700;
        padding: 0.9rem 2rem; border-radius: 999px;
        box-shadow: 0 10px 25px -5px rgba(124,156,255,.5);
        transition: transform .1s, opacity .2s;
        width: 100%; max-width: 16rem;
      }
      button.action:active { transform: scale(.97); }
      
      .status { text-align: center; min-height: 4rem; }
      .status .msg { color: var(--text); font-weight: 600; margin: 0; font-size: 1.1rem; }
      .status .freq { color: var(--primary); margin: .3rem 0 0; font-size: 1rem; font-weight: 700; }

      .settings-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem;
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .setting-item {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .setting-item div { display: flex; justify-content: space-between; color: var(--text); font-weight: 600; }
      input[type=range] { width: 100%; accent-color: var(--primary); }

      canvas#waveform {
        width: 100%; height: 80px;
        background: #040811;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <header>
        <h1>Whistle-Echo v2</h1>
        <p>Нажми старт, свистни — через фиксированную паузу придет ответ.</p>
      </header>

      <div class="control-panel">
        <div id="orb" class="orb">
          <div style="text-align:center;">
            <div class="emoji" id="orb-emoji">🎵</div>
            <div id="tag" class="tag">ГОТОВ</div>
          </div>
        </div>

        <button id="toggle" class="action">Начать слушать</button>

        <div class="status">
          <p id="msg" class="msg">Включите микрофон</p>
          <p id="freq" class="freq" hidden></p>
        </div>
      </div>

      <div class="settings-card">
        <canvas id="waveform"></canvas>

        <div class="setting-item">
          <div><span>Чувствительность (Порог):</span><span id="val-thresh">120</span></div>
          <input type="range" id="input-thresh" min="50" max="220" value="120">
        </div>

        <div class="setting-item">
          <div><span>Задержка ответа:</span><span id="val-delay">500 мс</span></div>
          <input type="range" id="input-delay" min="200" max="1200" step="100" value="500">
        </div>
      </div>
    </div>

    <script>
      const MIN_FREQ = 1100;
      const MAX_FREQ = 3500;
      
      let audioCtx = null;
      let analyser = null;
      let stream = null;
      let raf = null;
      let listening = false;

      // Режимы состояния: 'LISTEN', 'WAIT_REPLY', 'COOLDOWN'
      let state = 'LISTEN'; 
      let detectedFreq = 0;
      let timerId = null;

      const orb = document.getElementById("orb");
      const orbEmoji = document.getElementById("orb-emoji");
      const tag = document.getElementById("tag");
      const btn = document.getElementById("toggle");
      const msg = document.getElementById("msg");
      const freqEl = document.getElementById("freq");
      
      const inputThresh = document.getElementById("input-thresh");
      const valThresh = document.getElementById("val-thresh");
      const inputDelay = document.getElementById("input-delay");
      const valDelay = document.getElementById("val-delay");
      
      const canvas = document.getElementById("waveform");
      const canvasCtx = canvas.getContext("2d");

      inputThresh.addEventListener('input', () => valThresh.textContent = inputThresh.value);
      inputDelay.addEventListener('input', () => valDelay.textContent = inputDelay.value + " мс");

      function setOrbState(st, label, emoji) {
        orb.className = "orb " + st;
        tag.textContent = label;
        orbEmoji.textContent = emoji;
      }

      function playWhistle(freq) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = "sine";
        osc.frequency.value = freq;
        
        const now = audioCtx.currentTime;
        const dur = 0.45;
        
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
        gain.gain.linearRampToValueAtTime(0.4, now + dur - 0.08);
        gain.gain.linearRampToValueAtTime(0, now + dur);
        
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + dur);
      }

      function triggerResponse(freq) {
        state = 'WAIT_REPLY';
        setOrbState('captured', 'ПОЙМАЛ', '🎯');
        msg.textContent = "Свист обнаружен! Готовлю ответ...";
        freqEl.hidden = false;
        freqEl.textContent = `Частота: ${Math.round(freq)} Гц`;

        const delay = parseInt(inputDelay.value, 10);

        // Ждем заданную паузу (чтобы человек успел досвистеть)
        setTimeout(() => {
          playWhistle(freq);
          msg.textContent = "Отвечаю!";
          state = 'COOLDOWN';
          setOrbState('cooldown', 'ПАУЗА', '🔊');

          // Пауза 1.5 сек после своего ответа, чтобы не услышать самого себя
          setTimeout(() => {
            if (listening) {
              state = 'LISTEN';
              setOrbState('listening', 'СЛУШАЮ', '🎧');
              msg.textContent = "Слушаю... свистни!";
            }
          }, 1500);
        }, delay);
      }

      async function start() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = audioCtx || new AC();
          if (audioCtx.state === "suspended") await audioCtx.resume();

          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
          });

          const source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          const bins = new Uint8Array(analyser.frequencyBinCount);
          const timeData = new Uint8Array(analyser.fftSize);
          const binHz = audioCtx.sampleRate / analyser.fftSize;
          
          const minBin = Math.floor(MIN_FREQ / binHz);
          const maxBin = Math.min(bins.length - 1, Math.ceil(MAX_FREQ / binHz));

          listening = true;
          state = 'LISTEN';
          btn.textContent = "Остановить";
          setOrbState('listening', 'СЛУШАЮ', '🎧');
          msg.textContent = "Слушаю... свистни!";

          const loop = () => {
            if (!analyser || !listening) return;

            analyser.getByteFrequencyData(bins);
            
            let peakBin = -1;
            let peakVal = 0;
            const threshold = parseInt(inputThresh.value, 10);

            for (let i = minBin; i <= maxBin; i++) {
              if (bins[i] > peakVal) {
                peakVal = bins[i];
                peakBin = i;
              }
            }

            // Если находимся в режиме слуха и засекли громкий звук в нужном диапазоне
            if (state === 'LISTEN' && peakVal > threshold && peakBin > 0) {
              const freq = peakBin * binHz;
              triggerResponse(freq);
            }

            // Отрисовка графической волны
            analyser.getByteTimeDomainData(timeData);
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = state === 'LISTEN' ? '#7c9cff' : state === 'WAIT_REPLY' ? '#50e3c2' : '#ff7a7a';
            
            canvasCtx.beginPath();
            const sliceWidth = canvas.width / timeData.length;
            let x = 0;
            for (let i = 0; i < timeData.length; i++) {
              const v = timeData[i] / 128.0;
              const y = (v * canvas.height) / 2;
              if (i === 0) canvasCtx.moveTo(x, y);
              else canvasCtx.lineTo(x, y);
              x += sliceWidth;
            }
            canvasCtx.stroke();

            raf = requestAnimationFrame(loop);
          };

          loop();
        } catch (e) {
          msg.textContent = "Ошибка доступа к микрофону";
        }
      }

      function stop() {
        listening = false;
        state = 'LISTEN';
        if (raf) cancelAnimationFrame(raf);
        if (stream) stream.getTracks().forEach(t => t.stop());
        analyser = null;
        btn.textContent = "Начать слушать";
        setOrbState('', 'ГОТОВ', '🎵');
        msg.textContent = "Включите микрофон";
        freqEl.hidden = true;
      }

      btn.addEventListener("click", () => listening ? stop() : start());
    </script>
  </body>
</html>
